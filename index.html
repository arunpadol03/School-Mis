<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbydr1FVj-gAplbz6S3pqsE2kbjbpd1r3lQ5ceNF-Bxxx06MYhYuVS6j0TI-fbKffbuIDQ/exec">
  <title>सरस्वती विद्यालय MIS</title>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Noto Sans Devanagari', Arial, sans-serif;
      color: white;
      text-align: center;
      margin: 0;
    }
    .loader {
      animation: fadeIn 1s;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader">
    <h2>📚 सरस्वती विद्यालय MIS</h2>
    <div class="spinner"></div>
    <p>कृपया प्रतीक्षा करा... रीडायरेक्ट होत आहे</p>
    <p><small>रीडायरेक्ट नसेल तर <a href="https://script.google.com/macros/s/AKfycbydr1FVj-gAplbz6S3pqsE2kbjbpd1r3lQ5ceNF-Bxxx06MYhYuVS6j0TI-fbKffbuIDQ/exec" style="color: white;">येथे क्लिक करा</a></small></p>
  </div>
  <script>
    window.location.href = "https://script.google.com/macros/s/AKfycbydr1FVj-gAplbz6S3pqsE2kbjbpd1r3lQ5ceNF-Bxxx06MYhYuVS6j0TI-fbKffbuIDQ/exec";
  </script>
</body>
</html>
