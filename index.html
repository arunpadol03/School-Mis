<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#4f46e5">
  <title>सरस्वती विद्यालय MIS | विद्यार्थी व्यवस्थापन</title>
  
  <!-- Google Fonts - मराठी फॉन्ट -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }
    
    /* मुख्य कंटेनर */
    .main-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* नेव्हिगेशन बार */
    .navbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 12px 30px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
    }
    
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }
    
    .logo-text span {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .logout-btn {
      background: linear-gradient(135deg, #dc3545, #c82333);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 500;
      transition: 0.3s;
    }
    
    .logout-btn:hover {
      transform: scale(1.05);
    }
    
    /* IFrame कंटेनर */
    .iframe-container {
      flex: 1;
      padding: 0;
      background: white;
      min-height: calc(100vh - 70px);
    }
    
    iframe {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
      display: block;
    }
    
    /* लॉगिन सेक्शन */
    .login-section {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 70px);
      padding: 40px 20px;
    }
    
    .login-card {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 30px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      overflow: hidden;
      animation: fadeInUp 0.6s ease;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 35px 30px;
      text-align: center;
    }
    
    .card-header i {
      font-size: 55px;
      margin-bottom: 15px;
    }
    
    .card-header h3 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .card-header p {
      font-size: 13px;
      opacity: 0.9;
    }
    
    .card-body {
      padding: 35px 30px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      font-size: 15px;
      font-family: 'Noto Sans Devanagari', sans-serif;
      transition: 0.3s;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    .input-group input::placeholder {
      color: #aaa;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Noto Sans Devanagari', sans-serif;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    
    .footer {
      text-align: center;
      padding: 15px;
      background: #f8f9fa;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #eee;
    }
    
    /* लोडिंग ओव्हरले */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      display: none;
    }
    
    .loading-spinner {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }
    
    .loading-spinner i {
      font-size: 50px;
      color: #667eea;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* हाइड क्लास */
    .hidden {
      display: none;
    }
    
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 10px;
        padding: 15px;
      }
      .logo-text {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- नेव्हिगेशन बार -->
    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-school"></i>
        </div>
        <div class="logo-text">
          <span>सरस्वती माध्यमिक विद्यालय</span> | MIS
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> लॉगआउट
      </button>
    </nav>
    
    <!-- लॉगिन सेक्शन -->
    <div id="loginSection" class="login-section">
      <div class="login-card">
        <div class="card-header">
          <i class="fas fa-school"></i>
          <h3>📚 स्वागत आहे</h3>
          <p>कृपया लॉगिन करा</p>
        </div>
        <div class="card-body">
          <div class="input-group">
            <input type="text" id="user" placeholder="📧 यूजरनेम टाका">
          </div>
          <div class="input-group">
            <input type="password" id="pass" placeholder="🔒 पासवर्ड टाका">
          </div>
          <div class="input-group">
            <input type="text" id="schoolCode" placeholder="🏛 शाळा कोड टाका">
          </div>
          <button class="login-btn" onclick="loginToApp()">
            <i class="fas fa-arrow-right-to-bracket"></i> लॉगिन करा
          </button>
          <div id="loginMsg" style="text-align:center; margin-top:15px; color:#dc3545; font-size:13px;"></div>
        </div>
        <div class="footer">
          <p>© 2026 सरस्वती माध्यमिक विद्यालय | Developed by Arun Padol</p>
        </div>
      </div>
    </div>
    
    <!-- IFrame सेक्शन (MIS सिस्टीम) -->
    <div id="iframeSection" class="iframe-container hidden">
      <iframe id="misIframe" src="about:blank"></iframe>
    </div>
  </div>
  
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <i class="fas fa-spinner"></i>
      <p style="margin-top: 15px;">लॉगिन होत आहे...</p>
    </div>
  </div>

  <script>
    // ========== तुमची Apps Script Web App URL ==========
    const APP_URL = "https://script.google.com/macros/s/AKfycbwqLVLdseD1dwejF4wHpdOqCCcBncNTT4X6VafaT80OiwJzEbfDBveZ9fu7L1DAJThd/exec";
    // =====================================================
    
    let isLoggedIn = false;
    
    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }
    
    function loginToApp() {
      let user = document.getElementById('user').value.trim();
      let pass = document.getElementById('pass').value;
      let schoolCode = document.getElementById('schoolCode').value.trim();
      
      if(!user || !pass || !schoolCode) {
        Swal.fire({
          icon: 'warning',
          title: '⚠️ सूचना',
          text: 'कृपया सर्व फील्ड्स भरा',
          confirmButtonText: 'ठीक आहे'
        });
        return;
      }
      
      showLoading();
      
      // Apps Script ला रिक्वेस्ट पाठवा (GET पॅरामीटर्ससह)
      const loginUrl = APP_URL + "?user=" + encodeURIComponent(user) + 
                       "&pass=" + encodeURIComponent(pass) + 
                       "&schoolCode=" + encodeURIComponent(schoolCode);
      
      // IFrame मध्ये URL लोड करा
      const iframe = document.getElementById('misIframe');
      iframe.src = loginUrl;
      
      // IFrame लोड झाल्यावर
      iframe.onload = function() {
        hideLoading();
        // लॉगिन सेक्शन हाइड करा, IFrame दाखवा
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('iframeSection').classList.remove('hidden');
        document.getElementById('logoutBtn').style.display = 'block';
        isLoggedIn = true;
        
        // लॉगिन सक्सेस मेसेज
        Swal.fire({
          icon: 'success',
          title: '🎉 लॉगिन यशस्वी!',
          text: 'आपण यशस्वीरित्या प्रवेश केला आहे.',
          timer: 2000,
          showConfirmButton: false
        });
      };
      
      iframe.onerror = function() {
        hideLoading();
        Swal.fire({
          icon: 'error',
          title: '❌ लॉगिन अयशस्वी',
          text: 'कृपया यूजरनेम, पासवर्ड आणि शाळा कोड योग्य आहे का ते तपासा.',
          confirmButtonText: 'ठीक आहे'
        });
      };
    }
    
    function logout() {
      Swal.fire({
        title: '🚪 लॉगआउट करायचे आहे?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'होय',
        cancelButtonText: 'नाही'
      }).then((result) => {
        if(result.isConfirmed) {
          // फॉर्म रीसेट करा
          document.getElementById('user').value = '';
          document.getElementById('pass').value = '';
          document.getElementById('schoolCode').value = '';
          
          // IFrame रीसेट करा
          document.getElementById('misIframe').src = 'about:blank';
          
          // लॉगिन सेक्शन दाखवा, IFrame हाइड करा
          document.getElementById('loginSection').classList.remove('hidden');
          document.getElementById('iframeSection').classList.add('hidden');
          document.getElementById('logoutBtn').style.display = 'none';
          isLoggedIn = false;
          
          Swal.fire({
            icon: 'success',
            title: '👋 लॉगआउट यशस्वी!',
            text: 'आपण यशस्वीरित्या लॉगआउट केले आहे.',
            timer: 2000,
            showConfirmButton: false
          });
        }
      });
    }
    
    // पेज लोड झाल्यावर स्टोरेज तपासा
    window.onload = function() {
      // सत्र स्टोरेज तपासा
      if(sessionStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('user').value = sessionStorage.getItem('username') || '';
        document.getElementById('schoolCode').value = sessionStorage.getItem('schoolId') || '';
        loginToApp();
      }
    };
  </script>
</body>
</html>
