<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>सरस्वती विद्यालय MIS</title>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 30px;
      padding: 40px;
      width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>📚 सरस्वती विद्यालय MIS</h2>
    <input type="text" id="user" placeholder="यूजरनेम">
    <input type="password" id="pass" placeholder="पासवर्ड">
    <input type="text" id="schoolCode" placeholder="शाळा कोड">
    <button onclick="redirectToApp()">लॉगिन करा</button>
  </div>
  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwqLVLdseD1dwejF4wHpdOqCCcBncNTT4X6VafaT80OiwJzEbfDBveZ9fu7L1DAJThd/exec";
    
    function redirectToApp() {
      let user = document.getElementById('user').value;
      let pass = document.getElementById('pass').value;
      let schoolCode = document.getElementById('schoolCode').value;
      
      if(user && pass && schoolCode) {
        window.open(APP_URL + "?user=" + encodeURIComponent(user) + 
                    "&pass=" + encodeURIComponent(pass) + 
                    "&schoolCode=" + encodeURIComponent(schoolCode), "_blank");
      } else {
        alert("सर्व फील्ड्स भरा");
      }
    }
  </script>
</body>
</html>
